name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wm56_ci
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: wm56_ci_test
        ports:
          - 5547:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      WM_DB_TEST_MODE: '1'
      WM_REQUIRE_POSTGRES: '1'
      WM_DISABLE_PGSERVER_AUTOSTART: '1'
      WM_POSTGRES_TEST_URL: postgresql+pg8000://wm56_ci:synthetic-ci-password@127.0.0.1:5547/wm56_ci_test
      EMBEDDING_CACHE_DIR: ${{ runner.temp }}/wm56-models
      LLM_ENABLED: 'false'
      PAPPERS_ENABLED: 'false'
      SESSION_SECRET: synthetic-ci-session-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact application lock
        run: python -m pip install -r requirements.lock.txt
      - name: Installed dependency consistency
        run: python scripts/check_lock_consistency.py
      - name: Publication and complete reachable Git history scan
        run: python scripts/check_publication.py --git-history
      - name: Blocking correctness lint
        run: python -m flake8 src scripts tests migrations main.py
      - name: Explicit pinned model preparation
        run: python scripts/prepare_model.py --cache "$EMBEDDING_CACHE_DIR"
      - name: Single principal suite including real PostgreSQL, pgvector, embeddings and populated migrations
        run: |
          mkdir -p artifacts
          python scripts/run_tests.py --scratch-parent "${{ runner.temp }}/wm56-tests" --embedding-cache "$EMBEDDING_CACHE_DIR" tests -q -rs --junitxml=artifacts/junit.xml
      - name: Explicit migrations and application smoke after suite
        env:
          DATABASE_URL: ${{ env.WM_POSTGRES_TEST_URL }}
        run: |
          python -m alembic upgrade head
          python qa/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitized-junit
          path: artifacts/junit.xml
          retention-days: 7
          if-no-files-found: warn
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Existing development-tool findings remain visible as a failed job.
    # No automatic major-version upgrade or ignored vulnerability identifier.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit -r requirements.lock.txt --no-deps --disable-pip --format json --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 7
